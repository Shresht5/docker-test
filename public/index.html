<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" type="text/css" />
    <title>Home Page</title>
  </head>
  <body>
    <h1>Hi student, Welcome to XYZ University!</h1>
    <p>
      You can sign up to the platform to access all important notes & lectures.
    </p>

    <form action="/addUser" method="POST" target="_blank" id="signupForm">
      <div class="field">
        <label for="email">Email: </label>
        <input type="text" placeholder="jane@email.com" name="email" />
      </div>
      <div class="field">
        <label for="username">Username: </label>
        <input type="text" placeholder="Jane Doe" name="username" />
      </div>
      <div class="field">
        <label for="password">Password: </label>
        <input type="password" placeholder="password" name="password" />
      </div>

      <button id="formBtn">Create Account</button>
    </form>
    <h2>All Users</h2>
    <div id="usersList"></div>

    <script>
      fetch("/getUsers")
        .then((response) => response.json())
        .then((users) => {
          const container = document.getElementById("usersList");
          users.forEach((user) => {
            const div = document.createElement("div");
            div.innerHTML = `<p><strong>ID:</strong> ${user._id} | <strong>Email:</strong> ${user.email} | <strong>Username:</strong> ${user.username} | <strong>Password:</strong> ${user.password}</p>`;
            container.appendChild(div);
          });
        })
        .catch((error) => console.error("Error fetching users:", error));
    </script>
  </body>
</html>
